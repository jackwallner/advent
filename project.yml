name: Advent
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.38"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
schemes:
  Advent:
    build:
      targets:
        Advent: all
        AdventTests: [test]
        AdventUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AdventTests
        - AdventUITests
targets:
  Advent:
    type: application
    platform: iOS
    sources:
      - path: Advent
      - path: Shared
      - path: content/items.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.advent
        INFOPLIST_FILE: Advent/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  AdventTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdventTests
    dependencies:
      - target: Advent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.advent.tests
        GENERATE_INFOPLIST_FILE: YES
  AdventUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AdventUITests
    dependencies:
      - target: Advent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.advent.uitests
        GENERATE_INFOPLIST_FILE: YES
